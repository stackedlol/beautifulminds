<!doctype html>
<!-- Favicon generator: renders the letter-card field at icon size, one dither
     cell per pixel, then keeps the yellow + pink inks as white on transparent.
     Run: node scripts/favicon.mjs (drives this page headless, writes assets/favicon.*) -->
<meta charset="utf-8">
<canvas id="c"></canvas>
<pre id="out"></pre>
<script type="module">
import { FIELD } from "../assets/gl.js";

const params = new URLSearchParams(location.search);
const N = +(params.get("n") ?? 32);              // icon grid
const H = N, W = Math.round(N * 0.8);            // field is 4:5, centred in the square
const T = +(params.get("t") ?? 12);

const c = document.getElementById("c");
c.width = W; c.height = H;
const gl = c.getContext("webgl", { antialias: false, preserveDrawingBuffer: true });
const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; };
const prog = gl.createProgram();
gl.attachShader(prog, sh(gl.VERTEX_SHADER, `attribute vec2 aP; varying vec2 vUv; void main(){ vUv = aP*.5+.5; gl_Position = vec4(aP,0.,1.); }`));
gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FIELD));
gl.linkProgram(prog); gl.useProgram(prog);
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
const u = (n) => gl.getUniformLocation(prog, n);
gl.viewport(0, 0, W, H);
gl.uniform2f(u("uRes"), W, H);
gl.uniform1f(u("uT"), T);
gl.uniform1f(u("uCell"), 1);
gl.uniform3f(u("uW"), 0, 1, 0);
gl.drawArrays(gl.TRIANGLES, 0, 3);

const px = new Uint8Array(W * H * 4);
gl.readPixels(0, 0, W, H, gl.RGBA, gl.UNSIGNED_BYTE, px);
// coral g≈92 → transparent; yellow g≈214 and pink g≈128 → white
const on = [];
for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
  const g = px[((H - 1 - y) * W + x) * 4 + 1];   // readPixels is bottom-up
  if (g > 110) on.push([x + Math.floor((N - W) / 2), y]);
}

// SVG: one rect per lit cell, merged into horizontal runs
const runs = [];
const key = new Set(on.map(([x, y]) => x + "," + y));
for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
  if (!key.has(x + "," + y) || key.has(x - 1 + "," + y)) continue;
  let w = 1; while (key.has(x + w + "," + y)) w++;
  runs.push(`<rect x="${x}" y="${y}" width="${w}" height="1"/>`);
}
const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${N} ${N}" shape-rendering="crispEdges"><g fill="#fff">${runs.join("")}</g></svg>`;

// PNG fallback at 2× (nearest neighbour)
const S = 2, p = document.createElement("canvas");
p.width = p.height = N * S;
const ctx = p.getContext("2d");
ctx.fillStyle = "#fff";
for (const [x, y] of on) ctx.fillRect(x * S, y * S, S, S);

document.getElementById("out").textContent = JSON.stringify({ svg, png: p.toDataURL("image/png") });
</script>
