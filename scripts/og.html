<!doctype html>
<!-- Share card (1200×630) for X / iMessage link previews: the letter-card field,
     full-bleed, with the white favicon in the centre. Screenshot it headless:
     chrome-headless-shell --headless --window-size=1200,630 --screenshot=assets/og.png http://127.0.0.1:3016/scripts/og.html -->
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #ff5c52; }
  canvas { position: absolute; left: 0; width: 1200px; }
  img { position: absolute; left: 50%; top: 50%; width: 192px; height: 192px; transform: translate(-50%, -50%); image-rendering: pixelated; }
</style>
<canvas id="c" width="1200"></canvas>
<img src="../assets/favicon.svg" alt="">
<script type="module">
import { FIELD } from "../assets/gl.js";
const params = new URLSearchParams(location.search);
const c = document.getElementById("c");
// the field is drawn taller than the card and cropped, so the coral gap
// between the lobes sits behind the icon
const H = +(params.get("h") ?? 1400), OFF = +(params.get("off") ?? 330);
c.height = H; c.style.height = H + "px"; c.style.top = -OFF + "px";
document.querySelector("img").style.width = document.querySelector("img").style.height = (params.get("icon") ?? 176) + "px";
const gl = c.getContext("webgl", { antialias: false, preserveDrawingBuffer: true });
const sh = (t, s) => { const o = gl.createShader(t); gl.shaderSource(o, s); gl.compileShader(o); return o; };
const p = gl.createProgram();
gl.attachShader(p, sh(gl.VERTEX_SHADER, `attribute vec2 aP; varying vec2 vUv; void main(){ vUv = aP*.5+.5; gl_Position = vec4(aP,0.,1.); }`));
gl.attachShader(p, sh(gl.FRAGMENT_SHADER, FIELD));
gl.linkProgram(p); gl.useProgram(p);
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
const u = (n) => gl.getUniformLocation(p, n);
gl.uniform2f(u("uRes"), c.width, c.height);
gl.uniform1f(u("uT"), +(params.get("t") ?? 12));
gl.uniform1f(u("uCell"), +(params.get("cell") ?? 4));
gl.uniform3f(u("uW"), 0, 1, 0);
gl.drawArrays(gl.TRIANGLES, 0, 3);
</script>
