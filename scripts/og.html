<!doctype html>
<!-- Share card (1200×630) for X / link previews. Screenshot it headless:
     chrome-headless-shell --headless --window-size=1200,630 --screenshot=assets/og.png http://127.0.0.1:3016/scripts/og.html -->
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400&family=Geist+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; background: #09090b; overflow: hidden; }
  .card { display: grid; grid-template-columns: 1fr 440px; gap: 56px; height: 100%; box-sizing: border-box; padding: 56px; }
  .text { display: flex; flex-direction: column; color: #ececf0; font-family: Geist, sans-serif; }
  h1 { font-weight: 300; font-size: 76px; line-height: 1.02; letter-spacing: -0.03em; margin: 0; }
  p { font-weight: 300; font-size: 27px; line-height: 1.4; color: #a3a3ad; margin: 30px 0 0; max-width: 21em; }
  .foot { margin-top: auto; font-family: "Geist Mono", monospace; font-size: 18px; letter-spacing: 0.08em; text-transform: uppercase; color: #ececf0; display: flex; gap: 14px; align-items: center; }
  .foot i { width: 12px; height: 12px; background: #ffd657; display: inline-block; }
  canvas { width: 440px; height: 518px; image-rendering: pixelated; }
</style>
<div class="card">
  <div class="text">
    <h1>For Beautiful Minds.</h1>
    <p>Every X creator payout goes to research for BPD, schizophrenia, autism and ADHD. Logged in public, with receipts.</p>
    <div class="foot"><i></i>beautifulmind.site</div>
  </div>
  <canvas id="c" width="440" height="518"></canvas>
</div>
<script type="module">
import { FIELD } from "../assets/gl.js";
const c = document.getElementById("c");
const gl = c.getContext("webgl", { antialias: false, preserveDrawingBuffer: true });
const sh = (t, s) => { const o = gl.createShader(t); gl.shaderSource(o, s); gl.compileShader(o); return o; };
const p = gl.createProgram();
gl.attachShader(p, sh(gl.VERTEX_SHADER, `attribute vec2 aP; varying vec2 vUv; void main(){ vUv = aP*.5+.5; gl_Position = vec4(aP,0.,1.); }`));
gl.attachShader(p, sh(gl.FRAGMENT_SHADER, FIELD));
gl.linkProgram(p); gl.useProgram(p);
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
const u = (n) => gl.getUniformLocation(p, n);
gl.uniform2f(u("uRes"), c.width, c.height);
gl.uniform1f(u("uT"), 12);
gl.uniform1f(u("uCell"), 3);
gl.uniform3f(u("uW"), 0, 1, 0);
gl.drawArrays(gl.TRIANGLES, 0, 3);
</script>
